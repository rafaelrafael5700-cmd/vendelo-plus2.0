<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Maestro - Véndelo Plus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-black text-slate-900 tracking-tight italic">VÉNDELO+ <span class="text-blue-600">MASTER</span></h1>
                <p class="text-slate-500 font-medium">Control Centralizado de Licencias y Clientes</p>
            </div>
            <div class="flex gap-2">
                <button onclick="switchTab('clientes')" id="tab-btn-clientes" class="bg-blue-600 text-white px-4 py-2 rounded-2xl shadow-sm border border-blue-600 transition-all font-bold text-xs uppercase">
                    CLIENTES
                </button>
                <button onclick="switchTab('planes')" id="tab-btn-planes" class="bg-white text-slate-600 px-4 py-2 rounded-2xl shadow-sm border border-slate-200 hover:bg-slate-50 transition-all font-bold text-xs uppercase">
                    PLANES
                </button>
                <button onclick="refreshData()" class="flex items-center gap-2 bg-white px-4 py-2 rounded-2xl shadow-sm border border-slate-200 hover:bg-slate-50 transition-all font-bold text-slate-700 text-xs">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

    <div id="section-clientes">
        <!-- Dashboard Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div onclick="setFilter('todos')" class="glass p-6 rounded-3xl shadow-sm cursor-pointer hover:border-blue-300 transition-all group">
                <p class="text-slate-400 text-xs font-black uppercase tracking-widest mb-1 group-hover:text-blue-500">Total Clientes</p>
                <h3 id="stat-total" class="text-3xl font-black text-slate-800">0</h3>
            </div>
            <div onclick="setFilter('activos')" class="glass p-6 rounded-3xl shadow-sm cursor-pointer hover:border-green-300 transition-all group">
                <p class="text-slate-400 text-xs font-black uppercase tracking-widest mb-1 group-hover:text-green-500">Licencias Activas</p>
                <h3 id="stat-activas" class="text-3xl font-black text-green-600">0</h3>
            </div>
            <div onclick="setFilter('alertas')" class="glass p-6 rounded-3xl shadow-sm cursor-pointer hover:border-red-300 transition-all group">
                <p class="text-slate-400 text-xs font-black uppercase tracking-widest mb-1 group-hover:text-red-500">Vencidas / Bloqueadas</p>
                <h3 id="stat-alertas" class="text-3xl font-black text-red-600">0</h3>
            </div>
        </div>

        <!-- Search and Table Header -->
        <div class="mb-4 flex flex-col md:flex-row justify-between items-center gap-4 px-2">
            <div class="relative w-full md:w-96">
                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input type="text" id="client-search" oninput="applyFilters()" placeholder="Buscar por nombre, correo o ID..." 
                    class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-2xl shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all text-sm font-medium">
            </div>
            <div id="filter-indicator" class="text-[10px] font-black text-blue-600 uppercase italic bg-blue-50 px-3 py-1 rounded-lg border border-blue-100">
                Mostrando: TODOS
            </div>
        </div>

        <!-- Clients Table -->
        <div class="glass rounded-3xl shadow-xl overflow-hidden border border-slate-200">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-slate-50/50 border-bottom border-slate-100">
                            <th class="p-4 text-xs font-black text-slate-400 uppercase tracking-widest">Cliente</th>
                            <th class="p-4 text-xs font-black text-slate-400 uppercase tracking-widest">ID Sistema</th>
                            <th class="p-4 text-xs font-black text-slate-400 uppercase tracking-widest">Estatus</th>
                            <th class="p-4 text-xs font-black text-slate-400 uppercase tracking-widest">Vencimiento</th>
                            <th class="p-4 text-xs font-black text-slate-400 uppercase tracking-widest text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="clients-body" class="divide-y divide-slate-100">
                        <!-- Loading state -->
                        <tr>
                            <td colspan="5" class="p-12 text-center text-slate-400 italic">Cargando base de datos maestra...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Tab: Planes -->
    <div id="section-planes" class="hidden">
        <div class="bg-white rounded-[3rem] shadow-xl border border-slate-100 p-8">
            <div class="flex justify-between items-center mb-8">
                <div>
                    <h2 class="text-2xl font-black text-slate-900 italic uppercase">Editor de Planes</h2>
                    <p class="text-slate-500 font-medium">Personaliza los precios y características</p>
                </div>
                <button onclick="savePlanes()" class="bg-green-600 text-white px-8 py-3 rounded-2xl shadow-lg hover:shadow-green-200 transition-all font-bold text-xs uppercase tracking-widest">
                    GUARDAR CAMBIOS
                </button>
            </div>
            
            <div id="planes-container" class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <!-- Cards de planes dinámicas -->
            </div>
        </div>
    </div>
</div>

    <!-- Script para interactuar con Google Apps Script -->
    <script>
        const MASTER_URL = "https://script.google.com/macros/s/AKfycbxG8L3F26OkAIBnj9Abz6VD5wfV5t8Try6swqpam1A5z8MwVdi3ZgE86IX58eBBghOQVw/exec";

        let allClients = [];
        let allPlanes = [];
        let currentFilter = 'todos';

        function switchTab(tab) {
            document.getElementById('section-clientes').classList.toggle('hidden', tab !== 'clientes');
            document.getElementById('section-planes').classList.toggle('hidden', tab !== 'planes');
            
            // Actualizar estilos botones
            const btnClientes = document.getElementById('tab-btn-clientes');
            const btnPlanes = document.getElementById('tab-btn-planes');
            
            if (tab === 'clientes') {
                btnClientes.className = "bg-blue-600 text-white px-4 py-2 rounded-2xl shadow-sm border border-blue-600 transition-all font-bold text-xs uppercase";
                btnPlanes.className = "bg-white text-slate-600 px-4 py-2 rounded-2xl shadow-sm border border-slate-200 hover:bg-slate-50 transition-all font-bold text-xs uppercase";
            } else {
                btnPlanes.className = "bg-blue-600 text-white px-4 py-2 rounded-2xl shadow-sm border border-blue-600 transition-all font-bold text-xs uppercase";
                btnClientes.className = "bg-white text-slate-600 px-4 py-2 rounded-2xl shadow-sm border border-slate-200 hover:bg-slate-50 transition-all font-bold text-xs uppercase";
                loadPlanes();
            }
        }

        async function loadPlanes() {
            const container = document.getElementById('planes-container');
            container.innerHTML = '<div class="col-span-full py-12 text-center text-slate-400 italic">Cargando planes...</div>';
            
            try {
                const response = await fetch(`${MASTER_URL}?accion=obtenerPlanes`);
                allPlanes = await response.json();
                renderPlanes();
            } catch (error) {
                container.innerHTML = '<div class="col-span-full py-12 text-center text-red-400 font-bold">Error al cargar planes.</div>';
            }
        }

        function renderPlanes() {
            const container = document.getElementById('planes-container');
            container.innerHTML = allPlanes.map((p, index) => `
                <div class="bg-slate-50 rounded-[2rem] p-6 border border-slate-100 hover:border-blue-200 transition-all group">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center font-black">
                            ${index + 1}
                        </div>
                        <input type="text" value="${p.nombre}" onchange="updatePlanLocal(${index}, 'nombre', this.value)" 
                            class="bg-transparent border-none text-xl font-black text-slate-800 uppercase focus:ring-0 w-full" placeholder="Nombre del Plan">
                    </div>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Precio</label>
                            <input type="text" value="${p.precio}" onchange="updatePlanLocal(${index}, 'precio', this.value)" 
                                class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-lg font-bold text-blue-600 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Características (Separadas por coma)</label>
                            <textarea onchange="updatePlanLocal(${index}, 'caracteristicas', this.value)" 
                                class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-medium text-slate-600 focus:ring-2 focus:ring-blue-500 outline-none h-24 resize-none">${p.caracteristicas}</textarea>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updatePlanLocal(index, field, value) {
            allPlanes[index][field] = value;
        }

        async function savePlanes() {
            try {
                const formData = new URLSearchParams();
                formData.append('accion', 'actualizarPlanes');
                formData.append('dataPlanes', JSON.stringify(allPlanes));

                await fetch(MASTER_URL, {
                    method: 'POST',
                    body: formData,
                    mode: 'no-cors'
                });
                
                // Recargamos silenciosamente
                loadPlanes();
            } catch (error) {
                console.error('Error al guardar planes:', error);
            }
        }

        function refreshData() {
            const currentTab = !document.getElementById('section-clientes').classList.contains('hidden') ? 'clientes' : 'planes';
            if (currentTab === 'clientes') loadClients();
            else loadPlanes();
        }

        async function loadClients() {
            const body = document.getElementById('clients-body');
            body.innerHTML = '<tr><td colspan="5" class="p-12 text-center text-slate-400 italic">Consultando servidor...</td></tr>';
            
            try {
                const response = await fetch(`${MASTER_URL}?accion=obtenerClientes`);
                allClients = await response.json();
                renderClients();
            } catch (error) {
                console.error("Error cargando clientes:", error);
                body.innerHTML = '<tr><td colspan="5" class="p-12 text-center text-red-400 italic">Error de conexión con el servidor maestro</td></tr>';
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.getElementById('filter-indicator').innerText = `Mostrando: ${filter.toUpperCase()}`;
            applyFilters();
        }

        function applyFilters() {
            const searchTerm = document.getElementById('client-search').value.toLowerCase();
            const hoy = new Date();
            hoy.setHours(0,0,0,0);

            const filtered = allClients.filter(c => {
                const vencimiento = new Date(c.Fecha_Vencimiento);
                vencimiento.setHours(0,0,0,0);
                const estaVencido = vencimiento < hoy;
                const isBloqueado = c.Estatus === 'Bloqueado' || c.Estatus === 'Suspendido';
                
                // Filtro por categoría
                if (currentFilter === 'activos' && (estaVencido || isBloqueado || c.Estatus === 'Inactivo')) return false;
                if (currentFilter === 'alertas' && (!estaVencido && !isBloqueado)) return false;

                // Filtro por búsqueda
                const matchSearch = 
                    (c.Nombre || "").toLowerCase().includes(searchTerm) ||
                    (c.Correo || "").toLowerCase().includes(searchTerm) ||
                    (c.ID_Sistema || c.ID || "").toString().toLowerCase().includes(searchTerm);
                
                return matchSearch;
            });

            displayClients(filtered);
        }

        function renderClients() {
            // Actualizar estadísticas globales
            const hoy = new Date();
            hoy.setHours(0,0,0,0);
            
            let activas = 0;
            let alertas = 0;

            allClients.forEach(c => {
                const vencimiento = new Date(c.Fecha_Vencimiento);
                vencimiento.setHours(0,0,0,0);
                const estaVencido = vencimiento < hoy;
                const isBloqueado = c.Estatus === 'Bloqueado' || c.Estatus === 'Suspendido';

                if (c.Estatus === 'Activo' && !estaVencido) activas++;
                else if (isBloqueado || estaVencido) alertas++;
            });

            document.getElementById('stat-total').innerText = allClients.length;
            document.getElementById('stat-activas').innerText = activas;
            document.getElementById('stat-alertas').innerText = alertas;

            applyFilters();
        }

        function displayClients(clients) {
            const body = document.getElementById('clients-body');
            body.innerHTML = '';
            
            const hoy = new Date();
            hoy.setHours(0,0,0,0);

            if (clients.length === 0) {
                body.innerHTML = '<tr><td colspan="5" class="p-12 text-center text-slate-400 italic">No se encontraron clientes para este filtro</td></tr>';
                return;
            }

            clients.forEach(c => {
                const vencimiento = new Date(c.Fecha_Vencimiento);
                vencimiento.setHours(0,0,0,0);
                
                const estaVencido = vencimiento < hoy;
                const isBloqueado = c.Estatus === 'Bloqueado' || c.Estatus === 'Suspendido';
                const idSistema = (c.ID_Sistema || c.ID || "").toString();

                let statusLabel = 'ACTIVO';
                let statusClass = 'bg-green-100 text-green-700 border-green-200';

                if (isBloqueado) {
                    statusLabel = 'BLOQUEADO';
                    statusClass = 'bg-red-100 text-red-700 border-red-200';
                } else if (estaVencido) {
                    statusLabel = 'VENCIDO';
                    statusClass = 'bg-orange-100 text-orange-700 border-orange-200';
                } else if (c.Estatus === 'Inactivo') {
                    statusLabel = 'INACTIVO';
                    statusClass = 'bg-slate-100 text-slate-500 border-slate-200';
                }

                body.innerHTML += `
                    <tr class="hover:bg-slate-50/50 transition-colors border-b border-slate-100">
                        <td class="p-4">
                            <p class="font-black text-slate-800 uppercase italic text-sm">${c.Nombre || 'Sin Nombre'}</p>
                            <p class="text-[9px] text-slate-400 font-bold tracking-tight uppercase">${c.Correo || 'Sin correo'}</p>
                        </td>
                        <td class="p-4 font-mono text-xs font-bold text-slate-500">${idSistema}</td>
                        <td class="p-4">
                            <span class="text-[9px] font-black px-3 py-1 rounded-full border ${statusClass} uppercase italic">
                                ${statusLabel}
                            </span>
                        </td>
                        <td class="p-4 text-xs font-bold ${estaVencido ? 'text-red-500' : 'text-slate-600'}">
                            ${vencimiento.toLocaleDateString()}
                        </td>
                        <td class="p-4 text-right">
                            <div class="flex justify-end gap-2">
                                <button onclick="renovar('${idSistema}')" class="bg-blue-600 text-white text-[9px] font-black px-3 py-2 rounded-xl hover:bg-blue-700 transition-all uppercase italic">
                                    +30 DÍAS
                                </button>
                                <button onclick="toggleBloqueo('${idSistema}', ${isBloqueado})" 
                                    class="${isBloqueado ? 'bg-green-500 text-white shadow-lg shadow-green-100' : 'bg-slate-800 text-white'} text-[9px] font-black px-3 py-2 rounded-xl hover:opacity-80 transition-all uppercase italic">
                                    ${isBloqueado ? 'DESBLOQUEAR' : 'BLOQUEAR'}
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            lucide.createIcons();
        }

        async function renovar(id) {
            if(confirm(`¿Renovar 30 días para ${id}?`)) {
                await ejecutarAccionRemota(id, 'renovar');
            }
        }

        async function toggleBloqueo(id, actualmenteBloqueado) {
            const accion = actualmenteBloqueado ? 'desbloquear' : 'bloquear';
            if(confirm(`¿Seguro que deseas ${accion.toUpperCase()} a ${id}?`)) {
                await ejecutarAccionRemota(id, accion);
            }
        }

        async function ejecutarAccionRemota(id, accion) {
            try {
                // Pasamos los parámetros por URL para asegurar compatibilidad con Google Apps Script y no-cors
                const url = `${MASTER_URL}?accion=actualizarCliente&id=${encodeURIComponent(id)}&subAccion=${accion}`;
                
                await fetch(url, {
                    method: 'POST',
                    mode: 'no-cors'
                });
                
                // alert(`Solicitud de ${accion.toUpperCase()} enviada correctamente.`);
                // Recarga automática tras un breve delay
                setTimeout(loadClients, 2000);
            } catch (error) {
                console.error('Error de conexión:', error);
            }
        }

        // Carga inicial
        window.onload = () => {
            loadClients();
            lucide.createIcons();
        };
    </script>
</body>
</html>
